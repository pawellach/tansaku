<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Tansaku Docker self-hosting quickstart</title>
  <desc id="desc">A terminal-style self-hosting screen showing Docker Compose setup, dry-run, and live commands.</desc>
  <rect width="1200" height="760" fill="#0b0f14"/><rect x="54" y="48" width="1092" height="664" rx="16" fill="#151b22" stroke="#2b3540"/>
  <circle cx="88" cy="84" r="8" fill="#ff5f57"/><circle cx="116" cy="84" r="8" fill="#ffbd2e"/><circle cx="144" cy="84" r="8" fill="#28ca41"/><text x="190" y="90" fill="#7d8794" font-family="monospace" font-size="15">PowerShell · tansaku</text>
  <text x="92" y="150" fill="#7c6ff7" font-family="monospace" font-size="17">PS C:\Projects\tansaku&gt;</text><text x="370" y="150" fill="#e8eaf0" font-family="monospace" font-size="17">.\scripts\docker-tansaku.ps1 -Build -Setup</text>
  <text x="92" y="194" fill="#4ade80" font-family="monospace" font-size="16">✓ Docker engine ready</text><text x="92" y="226" fill="#4ade80" font-family="monospace" font-size="16">✓ Compose configuration valid</text><text x="92" y="258" fill="#4ade80" font-family="monospace" font-size="16">✓ Tansaku image built</text><text x="92" y="290" fill="#aab4c0" font-family="monospace" font-size="16">→ setup: Jira / AI / Telegram connections checked</text>
  <text x="92" y="356" fill="#7c6ff7" font-family="monospace" font-size="17">PS C:\Projects\tansaku&gt;</text><text x="370" y="356" fill="#e8eaf0" font-family="monospace" font-size="17">.\scripts\docker-tansaku.ps1 -DryRun</text>
  <text x="92" y="400" fill="#4ade80" font-family="monospace" font-size="16">✓ Preview only · no Jira writes</text><text x="92" y="432" fill="#aab4c0" font-family="monospace" font-size="16">→ discovered 5 new issues</text><text x="92" y="464" fill="#aab4c0" font-family="monospace" font-size="16">→ analysis plan generated</text>
  <text x="92" y="530" fill="#7c6ff7" font-family="monospace" font-size="17">PS C:\Projects\tansaku&gt;</text><text x="370" y="530" fill="#e8eaf0" font-family="monospace" font-size="17">.\scripts\docker-tansaku.ps1</text><text x="92" y="582" fill="#aab4c0" font-family="monospace" font-size="16">→ self-hosted one-shot intake · schedule with cron or CI</text>
  <text x="600" y="672" text-anchor="middle" fill="#59636f" font-family="Arial,sans-serif" font-size="14">Portfolio demo · secrets and organisation data omitted</text>
</svg>
