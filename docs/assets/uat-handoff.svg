<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Tansaku UAT handoff</title>
  <desc id="desc">A requester-facing delivery comment with UAT steps and automated test evidence.</desc>
  <rect width="1200" height="760" fill="#0d1117"/><rect x="44" y="34" width="1112" height="692" rx="22" fill="#161a20" stroke="#2b333d"/>
  <text x="82" y="92" fill="#a78bfa" font-family="Arial,sans-serif" font-size="22" font-weight="700">Tansaku · Delivery handoff</text><text x="82" y="122" fill="#7d8794" font-family="Arial,sans-serif" font-size="15">PROJ-142 · requester comment · specialist agent: Salesforce Admin</text>
  <rect x="82" y="164" width="1036" height="472" rx="12" fill="#1c2128" stroke="#303944"/>
  <text x="118" y="210" fill="#e8eaf0" font-family="Arial,sans-serif" font-size="24" font-weight="700">Ready for UAT</text><rect x="944" y="184" width="140" height="32" rx="16" fill="#123c2b"/><text x="1014" y="206" text-anchor="middle" fill="#4ade80" font-family="Arial,sans-serif" font-size="14" font-weight="700">TESTS PASS</text>
  <text x="118" y="254" fill="#a78bfa" font-family="Arial,sans-serif" font-size="16" font-weight="700">What changed</text><text x="118" y="281" fill="#c7ced8" font-family="Arial,sans-serif" font-size="16">Renewal approval now preserves the subscription context used by pricing validation.</text>
  <text x="118" y="326" fill="#a78bfa" font-family="Arial,sans-serif" font-size="16" font-weight="700">UAT steps</text><text x="118" y="355" fill="#c7ced8" font-family="Arial,sans-serif" font-size="16">1. Open a renewal quote with an active subscription.</text><text x="118" y="384" fill="#c7ced8" font-family="Arial,sans-serif" font-size="16">2. Submit the quote for approval.</text><text x="118" y="413" fill="#c7ced8" font-family="Arial,sans-serif" font-size="16">3. Confirm pricing validation completes without an error.</text><text x="118" y="442" fill="#c7ced8" font-family="Arial,sans-serif" font-size="16">4. Verify the approval record contains the renewal context.</text>
  <line x1="118" y1="474" x2="1082" y2="474" stroke="#303944"/><text x="118" y="510" fill="#a78bfa" font-family="Arial,sans-serif" font-size="16" font-weight="700">Evidence</text><text x="118" y="539" fill="#4ade80" font-family="Arial,sans-serif" font-size="16">✓ 18 automated tests passed  ·  ✓ regression suite passed  ·  ✓ no known blockers</text><text x="118" y="583" fill="#7d8794" font-family="Arial,sans-serif" font-size="15">Please reply with UAT result: PASS, FAIL + steps, or request clarification.</text>
  <text x="600" y="684" text-anchor="middle" fill="#59636f" font-family="Arial,sans-serif" font-size="14">Portfolio demo · synthetic delivery evidence</text>
</svg>
