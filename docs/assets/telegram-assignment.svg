<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Tansaku Telegram assignment notification</title>
  <desc id="desc">A dark Telegram-style message showing an AI Jira intake summary with inline assignment buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111820"/><stop offset="1" stop-color="#0b1015"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#0d1117"/>
  <rect x="34" y="34" width="1132" height="692" rx="24" fill="url(#bg)" stroke="#27313d" stroke-width="2"/>
  <circle cx="87" cy="93" r="25" fill="#2aabee"/><path d="M72 92 105 78 96 111 87 101 80 106Z" fill="#fff"/>
  <text x="130" y="88" fill="#f2f5f8" font-family="Arial, sans-serif" font-size="24" font-weight="700">Telegram</text>
  <text x="130" y="115" fill="#8b98a8" font-family="Arial, sans-serif" font-size="16">Tansaku Bot · assignment decision</text>
  <circle cx="1088" cy="92" r="5" fill="#4ade80"/><text x="1104" y="98" fill="#8b98a8" font-family="Arial, sans-serif" font-size="14">PORTFOLIO DEMO</text>
  <rect x="102" y="166" width="996" height="474" rx="18" fill="#1b2733" stroke="#314252" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="215" fill="#71b7f2" font-family="Arial, sans-serif" font-size="20" font-weight="700">Tansaku · AI intake ready</text>
  <text x="136" y="260" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">PROJ-142 · Quote approval fails for renewals</text>
  <text x="136" y="309" fill="#d6dee7" font-family="Arial, sans-serif" font-size="18">Initial analysis completed and added to Jira.</text>
  <text x="136" y="340" fill="#aab7c4" font-family="Arial, sans-serif" font-size="17">Scope: validation rule + renewal pricing flow</text>
  <text x="136" y="368" fill="#aab7c4" font-family="Arial, sans-serif" font-size="17">Complexity: Medium · Status: Waiting · Label: ai-intake</text>
  <line x1="136" y1="405" x2="1064" y2="405" stroke="#344452" stroke-width="1"/>
  <text x="136" y="445" fill="#e8eef4" font-family="Arial, sans-serif" font-size="18" font-weight="700">Assign to:</text>
  <rect x="136" y="472" width="210" height="58" rx="10" fill="#2b5278" stroke="#4384bb"/><text x="241" y="509" text-anchor="middle" fill="#9ed0f7" font-family="Arial, sans-serif" font-size="18" font-weight="700">Developer A</text>
  <rect x="364" y="472" width="210" height="58" rx="10" fill="#2b5278" stroke="#4384bb"/><text x="469" y="509" text-anchor="middle" fill="#9ed0f7" font-family="Arial, sans-serif" font-size="18" font-weight="700">Developer B</text>
  <rect x="592" y="472" width="210" height="58" rx="10" fill="#2b5278" stroke="#4384bb"/><text x="697" y="509" text-anchor="middle" fill="#9ed0f7" font-family="Arial, sans-serif" font-size="18" font-weight="700">Tech Lead</text>
  <rect x="820" y="472" width="244" height="58" rx="10" fill="#3a2630" stroke="#9d5269"/><text x="942" y="509" text-anchor="middle" fill="#f0a7ba" font-family="Arial, sans-serif" font-size="18" font-weight="700">Skip</text>
  <text x="136" y="581" fill="#718196" font-family="Arial, sans-serif" font-size="15">One click assigns the Jira issue and moves it to In Progress.</text>
  <text x="1032" y="581" text-anchor="end" fill="#718196" font-family="Arial, sans-serif" font-size="15">Tansaku · self-hosted</text>
  <text x="600" y="684" text-anchor="middle" fill="#596979" font-family="Arial, sans-serif" font-size="14">Portfolio demo — no real Jira or Telegram data</text>
</svg>
