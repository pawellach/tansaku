  <rect x="44" y="94" width="1112" height="610" rx="10" fill="#fff" stroke="#dfe1e6"/>
  <text x="78" y="139" fill="#5e6c84" font-family="Arial,sans-serif" font-size="15">PROJ-142</text><text x="78" y="184" fill="#172b4d" font-family="Arial,sans-serif" font-size="30" font-weight="700">Quote approval fails for renewals</text>
