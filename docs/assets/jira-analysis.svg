  <line x1="78" y1="274" x2="1120" y2="274" stroke="#dfe1e6"/>
  <text x="78" y="312" fill="#5e6c84" font-family="Arial,sans-serif" font-size="14" font-weight="700">Comments</text>
  <rect x="78" y="334" width="720" height="292" rx="8" fill="#f4f5f7" stroke="#dfe1e6"/><circle cx="112" cy="372" r="18" fill="#6554c0"/><text x="112" y="378" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">AI</text><text x="144" y="378" fill="#172b4d" font-family="Arial,sans-serif" font-size="16" font-weight="700">Tansaku · Initial Analysis</text>
  <text x="110" y="425" fill="#172b4d" font-family="Arial,sans-serif" font-size="16" font-weight="700">Business Context</text><text x="110" y="451" fill="#42526e" font-family="Arial,sans-serif" font-size="15">Renewal quotes fail during approval when the pricing</text><text x="110" y="474" fill="#42526e" font-family="Arial,sans-serif" font-size="15">validation rule meets an incomplete subscription context.</text>
  <text x="110" y="516" fill="#172b4d" font-family="Arial,sans-serif" font-size="16" font-weight="700">Implementation Scope</text><text x="110" y="542" fill="#42526e" font-family="Arial,sans-serif" font-size="15">• inspect renewal validation and pricing Flow</text><text x="110" y="566" fill="#42526e" font-family="Arial,sans-serif" font-size="15">• add regression coverage for approval path</text>
  <rect x="846" y="334" width="248" height="150" rx="8" fill="#f4f5f7"/><text x="872" y="368" fill="#5e6c84" font-family="Arial,sans-serif" font-size="13" font-weight="700">TANSAKU INTAKE</text><text x="872" y="404" fill="#172b4d" font-family="Arial,sans-serif" font-size="16">Complexity</text><text x="1018" y="404" text-anchor="end" fill="#ff991f" font-family="Arial,sans-serif" font-size="16" font-weight="700">Medium</text><text x="872" y="438" fill="#172b4d" font-family="Arial,sans-serif" font-size="16">Docs found</text><text x="1018" y="438" text-anchor="end" fill="#36b37e" font-family="Arial,sans-serif" font-size="16" font-weight="700">3</text><text x="872" y="472" fill="#172b4d" font-family="Arial,sans-serif" font-size="16">Next step</text><text x="1018" y="472" text-anchor="end" fill="#0747a6" font-family="Arial,sans-serif" font-size="16" font-weight="700">Assign</text>
