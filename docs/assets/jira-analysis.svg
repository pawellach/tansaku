<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Tansaku Jira issue after AI intake</title>
  <desc id="desc">A Jira-style issue view showing an AI analysis comment, Waiting status, and intake metadata.</desc>
  <rect width="1200" height="760" fill="#f7f8fa"/>
