[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tansaku"
version = "0.1.0"
description = "Configurable AI intake agent for Jira — self-hostable, Telegram/Slack notifications"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
]

[project.scripts]
tansaku = "tansaku.cli:cli"

[project.urls]
Homepage = "https://github.com/pawellach/tansaku"
