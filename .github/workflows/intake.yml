name: Tansaku Intake

on:
  schedule:
    # Mon–Fri, every 2h during business hours UTC
    - cron: '0 7,9,11,13,15 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes to Jira)'
        type: boolean
        default: false
      ticket:
        description: 'Single ticket key (e.g. PROJ-123) — leave blank for daily batch'
        type: string
        default: ''

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade build tools
        run: pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -e .

      - name: Run Tansaku
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          FLAGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && FLAGS="--dry-run"
          [ -n "${{ inputs.ticket }}" ] && FLAGS="$FLAGS --ticket ${{ inputs.ticket }}"
          tansaku run $FLAGS

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intake-log-${{ github.run_id }}
          path: tansaku_*.log
          if-no-files-found: ignore
          retention-days: 30
