jira:
  base_url: "https://yourcompany.atlassian.net"
  email: "you@company.com"
  api_token: "${JIRA_API_TOKEN}"
  project: "PROJ"

# ── AI Provider ───────────────────────────────────────────────────────────────
# Choose one provider. Uncomment the block you want to use.

# Option A: Anthropic API (direct)
ai:
  provider: "anthropic"
  api_key: "${ANTHROPIC_API_KEY}"
  model: "claude-opus-4-5-20251101"
  max_tokens: 8096

# Option B: AWS Bedrock (use if you have AWS but no direct Anthropic API key)
# ai:
#   provider: "bedrock"
#   aws_access_key: "${AWS_ACCESS_KEY_ID}"
#   aws_secret_key: "${AWS_SECRET_ACCESS_KEY}"
#   aws_region: "${AWS_DEFAULT_REGION}"   # e.g. "us-east-1" or "eu-central-1"
#   model: "anthropic.claude-opus-4-5-20251101"   # note the "anthropic." prefix
#   max_tokens: 8096
#   # Tip: if running on EC2/ECS/Lambda with an IAM role,
#   # omit aws_access_key and aws_secret_key — credentials are picked up automatically.

# Option C: OpenAI
# ai:
#   provider: "openai"
#   api_key: "${OPENAI_API_KEY}"
#   model: "gpt-4o"
#   max_tokens: 4096

# ── Notifications ─────────────────────────────────────────────────────────────
notification:
  channel: "telegram"   # "telegram" | "slack" | "none"

  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

  slack:
    bot_token: "${SLACK_BOT_TOKEN}"
    channel: "#intake"

# ── Intake behaviour ──────────────────────────────────────────────────────────
intake:
  auto_close_days: 5
  max_batch: 5
  label: "ai-intake"
  time_window_hours: 2

  transitions:
    waiting: "41"
    in_progress: "21"
    rejected: "61"

  statuses_to_skip:
    - "Waiting"
    - "In test"
    - "In Progress"

  language: "en"   # "en" or "pl"

confluence:
  enabled: true
  spaces:
    - "PROJ"
    - "ENG"

# Optional: domain-specific rules file (copy knowledge-base.example.json)
knowledge_base: "./knowledge-base.json"

# Optional: team keyword → assignee mapping
team: "./team.json"
